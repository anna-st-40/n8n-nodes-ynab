# Publishes the package to npm with a provenance statement, which n8n requires
# for community nodes. Provenance links the published tarball back to this
# workflow run and commit, so npm can attest to where the package was built.
#
# Auth uses npm trusted publishing (OIDC) — there is no NPM_TOKEN. npm exchanges
# the short-lived OIDC token minted by the `id-token: write` permission below for
# publish rights, so no long-lived credential is stored anywhere.
#
# This works only because npmjs.com is configured to trust this exact repository
# and workflow filename. Renaming this file, or moving it to another repo, breaks
# publishing until the trusted publisher entry is updated to match at:
#   https://www.npmjs.com/package/n8n-nodes-ynab-api/access
#
# Version 1.0.0 was published with a token because npm cannot configure a trusted
# publisher for a package that does not exist yet (npm/cli#8544). That token has
# served its purpose and should no longer exist.
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Run `npm run release` locally. That wraps release-it, which lints, builds,
# prompts for a version bump, updates CHANGELOG.md, then commits, tags, pushes,
# and creates a GitHub release. Pushing the tag is what triggers this workflow.
#
# Tags are unprefixed (1.0.0, not v1.0.0) to match release-it's default.

name: Publish to npm

on:
  push:
    tags:
      # Matches 1.0.0, 1.2.3, 2.0.0-rc.1, etc.
      - '*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # required to mint the OIDC token for provenance

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted publishing and --provenance need npm 11.5.1 or newer, which is
      # ahead of the npm bundled with the Node.js runtime.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify package version matches tag
        if: github.event_name == 'push'
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Publishing version $PKG_VERSION"

      - name: Release
        # Detects GITHUB_ACTIONS and so runs lint, build, then publishes with
        # NPM_CONFIG_PROVENANCE=true. `prepublishOnly` (n8n-node prerelease)
        # blocks any publish that does not go through this path.
        run: npm run release
