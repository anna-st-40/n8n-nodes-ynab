name: CI

on:
  push:
    branches: main
  pull_request:
    branches: main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify build output
        # `n8n-node build` compiles TypeScript and copies icons and the codex
        # file. If any of these are missing, n8n cannot load the node, so fail
        # here rather than at install time for a user.
        run: |
          for f in \
            dist/nodes/Ynab/Ynab.node.js \
            dist/nodes/Ynab/Ynab.node.json \
            dist/credentials/YnabApi.credentials.js \
            dist/icons/ynab.svg \
            dist/icons/ynab.dark.svg
          do
            if [ ! -f "$f" ]; then
              echo "Missing expected build artifact: $f"
              exit 1
            fi
          done
          echo "All expected build artifacts present."
